<ion-input
  [label]="label()"
  placeholder="Taper le début du numéro"
  [(ngModel)]="num"
  (ionInput)="onNumChanged($event)"
  (click)="onInputClick($event)">
</ion-input>
@if(showList())
{
  <ion-card>
    <ion-card-content>
      <ion-list>
        @for( lieu of listeLieux | async; track lieu.num )
        {
          <ion-item (click)="onClickNumSelected( lieu.num )">
            {{lieu.num}} - {{lieu.nom}}
          </ion-item>
        }
      </ion-list>
    </ion-card-content>
  </ion-card>
}
